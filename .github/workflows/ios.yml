name: iOS bauen und zu App Store Connect hochladen

on:
  push:
    branches:
      - release-ios
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer, die im App Store angezeigt wird"
        required: true
        default: "1.0.0"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  ios:
    runs-on: macos-26
    env:
      API_KEY_ID: Z7T5YKSW7U
      API_ISSUER: 951bd4e3-5906-4027-aa20-7cbb4507902b
      TEAM_ID: ${{ vars.APPLE_TEAM_ID || '625A6TQ9CK' }}
      APP_VERSION: ${{ github.event.inputs.version || '1.0.0' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Voraussetzungen prüfen
        env:
          P8: ${{ secrets.APPSTORE_P8 }}
          RC: ${{ secrets.REVENUECAT_IOS_KEY }}
        run: |
          [ -n "$P8" ] || { echo "::error::Secret APPSTORE_P8 fehlt"; exit 1; }
          [ -n "$TEAM_ID" ] || { echo "::error::Variable APPLE_TEAM_ID fehlt"; exit 1; }
          [ -n "$RC" ] || echo "::warning::Secret REVENUECAT_IOS_KEY fehlt – das Abo funktioniert in diesem Build nicht"
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); [ -n "$X" ] && sudo xcode-select -s "$X" || true
          xcodebuild -version

      - name: Pakete installieren
        run: npm install --no-audit --no-fund

      - name: App-Oberfläche bauen
        env:
          REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
        run: npm run build:web

      - name: iOS-Projekt erzeugen
        run: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios
          npx @capacitor/assets generate --ios --iconBackgroundColor '#16141b' --splashBackgroundColor '#16141b' --splashBackgroundColorDark '#16141b'

      - name: App-Einstellungen (Info.plist)
        run: |
          P=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          $PB -c "Set :CFBundleDisplayName FocusHer" $P
          $PB -c "Set :CFBundleDevelopmentRegion de" $P
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" $P || $PB -c "Set :ITSAppUsesNonExemptEncryption false" $P
          $PB -c "Delete :UISupportedInterfaceOrientations" $P || true
          $PB -c "Add :UISupportedInterfaceOrientations array" $P
          $PB -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $P
          $PB -c "Delete :UIStatusBarStyle" $P || true
          $PB -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" $P
          $PB -c "Set :UIViewControllerBasedStatusBarAppearance false" $P || $PB -c "Add :UIViewControllerBasedStatusBarAppearance bool false" $P
          plutil -lint $P

      - name: API-Schlüssel bereitstellen
        env:
          P8: ${{ secrets.APPSTORE_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$P8" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          echo "KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8" >> $GITHUB_ENV

      - name: App-Store-Signatur anlegen (Zertifikat + Profil)
        env:
          BUNDLE_ID: de.vellunaprints.focusher
          RUN_ID: ${{ github.run_number }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography requests || python3 -m pip install --quiet pyjwt cryptography requests
          python3 scripts/asc_signing.py setup

      - name: Signatur im Xcode-Projekt eintragen
        run: |
          python3 - <<'PY'
          import os, re
          p = "ios/App/App.xcodeproj/project.pbxproj"
          s = open(p).read()
          team, prof = os.environ["TEAM_ID"], os.environ["PROFILE_NAME"]
          s = s.replace("CODE_SIGN_STYLE = Automatic;",
              f'CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = {team};\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{prof}";\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";')
          s = s.replace('CODE_SIGN_IDENTITY = "iPhone Developer";', 'CODE_SIGN_IDENTITY = "Apple Distribution";')
          open(p, "w").write(s)
          print("Projekt auf manuelle App-Store-Signatur umgestellt:", prof)
          PY

      - name: Archiv bauen und signieren
        run: |
          mkdir -p build
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/FocusHer.xcarchive \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            TARGETED_DEVICE_FAMILY=1 \
            archive > build/archive.log 2>&1 || { grep -E "error:|Error|failed|FAILED" build/archive.log | head -60; tail -n 60 build/archive.log; exit 1; }
          tail -n 15 build/archive.log

      - name: Hochladen zu App Store Connect
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>de.vellunaprints.focusher</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/FocusHer.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER" > build/export.log 2>&1 || { tail -n 80 build/export.log; exit 1; }
          tail -n 20 build/export.log
          echo "Build $APP_VERSION ($BUILD_NUMBER) hochgeladen. Er erscheint nach 10–30 Minuten in TestFlight."

      - name: Zertifikat widerrufen und Profil löschen
        if: always()
        run: python3 scripts/asc_signing.py cleanup || true

      - name: Schlüssel löschen
        if: always()
        run: rm -rf ~/.appstoreconnect

      - name: Protokoll bei Fehler in Branch ci-logs ablegen
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp build/*.log /tmp/logs/ 2>/dev/null || true
          echo "Run ${{ github.run_number }} – $(date)" > /tmp/logs/info.txt
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-logs 2>/dev/null && git checkout -B ci-logs origin/ci-logs || git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf logs && mkdir -p logs && cp /tmp/logs/* logs/
          git add logs && git commit -m "Build-Protokoll Run ${{ github.run_number }}" && git push -f origin ci-logs
